<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6️⃣ Task — Product of Array Except Self</title>
</head>
<body>
    <script>
        let arr = [1,2,3,4];
        let left = [];
        let right = [];
        let product = 1;
        
        for (let i = 0 ; i < arr.length ; i++){
            left[i] = product;
            product = arr[i] * product ;
        }
        console.log(left);
        
        product = 1;

        for (let i = arr.length-1 ; i >= 0 ; i--){
            right[i] = product;
            product = arr[i] * product ;
        }
        console.log(right);

        let result = [];
        for (let i = 0 ; i < arr.length ; i++){
            result[result.length] = left[i] * right[i];
        }
        console.log(result);
    </script>
</body>
</html>
